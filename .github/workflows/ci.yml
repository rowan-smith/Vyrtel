name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this whole suite as its required checks (docs/releasing.md).
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels CI or vice versa.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend:
    name: Backend (fmt, clippy, tests, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Release build
        run: cargo build --release --locked -p server
      - name: Binary size
        run: ls -l target/release/vyrtel
      - name: Restore drill (docs/configuration.md#backup-and-restore)
        run: bash scripts/backup/restore-drill.sh target/release/vyrtel

  dotnet:
    name: .NET (benchmark, baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build dotnet/Vyrtel.slnx -c Release
      # Baseline arithmetic, comparison and report contents (docs/benchmarks.md#reproducible-baselines).
      # No server needed; the measured run is in benchmark.yml.
      - name: Tests
        run: dotnet test dotnet/Vyrtel.slnx -c Release --no-build

  security:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo-deny's advisories check reads the same RustSec database as cargo-audit and also
      # fails on yanked crates (deny.toml), so it is the one Rust vulnerability check.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  release-tooling:
    name: Release gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.mjs

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server with embedded UI
        env:
          VYRTEL_REQUIRE_WEB_UI: '1'
        run: cargo build -p server
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Release gate against the built binary
        run: node scripts/release/release.mjs verify-binary target/debug/vyrtel
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - id: version
        run: echo "version=$(node --input-type=module -e "import { workspaceVersion } from './scripts/release/release.mjs'; console.log(workspaceVersion())")" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vyrtel:ci
          build-args: VYRTEL_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The release gate's persistent-deployment smoke test (docs/releasing.md#container-image-checks):
      # non-root user, readiness and UI on a named volume, events surviving a recreated
      # container, and the uid hint on an unwritable bind mount. arm64 runs at release.
      - name: Smoke test
        run: node scripts/release/release.mjs verify-image vyrtel:ci --version "${{ steps.version.outputs.version }}" --platform linux/amd64 --bind-mount on
