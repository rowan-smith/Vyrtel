name: CLA

# Asks first-time contributors to sign the Individual CLA (docs/cla/individual.md) by commenting on
# their pull request, and records signatures in signatures/cla.json on the `cla-signatures` branch.
# Corporate CLAs (docs/cla/corporate.md) are signed by email; their contributors still sign here.
#
# pull_request_target runs this workflow from main with a token that can comment and write the
# signatures branch. It never checks out or runs code from the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/rowan-smith/Vyrtel/blob/main/docs/cla/individual.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer and bots don't need to sign.
          allowlist: rowan-smith,dependabot[bot],github-actions[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [Individual Contributor License Agreement](https://github.com/rowan-smith/Vyrtel/blob/main/docs/cla/individual.md)
            and sign it by replying with the comment below. You only need to do this once.
            If you're contributing for your employer, they also need to sign the
            [Corporate CLA](https://github.com/rowan-smith/Vyrtel/blob/main/docs/cla/corporate.md).
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
