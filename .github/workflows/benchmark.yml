name: Benchmarks

# Measures the release server on GitHub's runners and commits the rollup that the website
# renders at /docs/benchmarks.html. Running on the same hardware every time keeps the
# numbers comparable across commits.
#
# Two modes:
#   - push to main (paths below): refresh docs/benchmarks/results.{json,md} — the "latest" run.
#   - push of a version tag (v*): snapshot the tagged commit at
#     docs/benchmarks/versions/<tag>.json so the site can chart progress between releases.
#     Path filters don't apply to tag pushes, and a tag can't be committed to, so the snapshot
#     is committed onto main instead.
#
# The result paths exclude docs/**, so the commit this job makes never re-triggers itself.
# Commits pushed with GITHUB_TOKEN cannot trigger the push-based Deploy site workflow, so we
# dispatch it explicitly once the results are in.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - dotnet/**
      - .github/workflows/benchmark.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run benchmarks and publish results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build server (release)
        run: cargo build --release --locked -p server

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            dotnet run --project dotnet/Vyrtel.Benchmark -c Release -- \
              --job short \
              --label "${{ github.ref_name }}" \
              --out "docs/benchmarks/versions/${{ github.ref_name }}.json"
          else
            dotnet run --project dotnet/Vyrtel.Benchmark -c Release -- --job short
          fi

      - name: Show results
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            cat "docs/benchmarks/versions/${{ github.ref_name }}.md"
          else
            cat docs/benchmarks/results.md
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            tmp="$(mktemp -d)"
            cp "docs/benchmarks/versions/$tag.json" "$tmp/"
            cp "docs/benchmarks/versions/$tag.md" "$tmp/"
            rm -f "docs/benchmarks/versions/$tag.json" "docs/benchmarks/versions/$tag.md"
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p docs/benchmarks/versions
            cp "$tmp/$tag.json" "docs/benchmarks/versions/$tag.json"
            cp "$tmp/$tag.md" "docs/benchmarks/versions/$tag.md"
            git add "docs/benchmarks/versions/$tag.json" "docs/benchmarks/versions/$tag.md"
            msg="chore(benchmarks): add $tag snapshot"
          else
            git add docs/benchmarks/results.json docs/benchmarks/results.md
            msg="chore(benchmarks): refresh results"
          fi
          if git diff --staged --quiet; then
            echo "No changes to benchmark results"
          else
            git commit -m "$msg"
            git push origin HEAD:main
          fi

      - name: Redeploy the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
