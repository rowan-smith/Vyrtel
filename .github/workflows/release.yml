name: Release

# Publishes a release only after it has been validated (docs/releasing.md):
#
#   preflight ─┬─ ci (the full CI suite) ─┐
#              └──────────────────────────┴─ binaries ─ verify ─ image ─ release
#
# - preflight: the tag must be v<semver> and match the workspace version, or nothing runs.
# - ci: every required CI check, run against the tagged commit.
# - binaries: built with the UI that CI tested; each one's --version and embedded UI are
#   checked on its own runner before it is uploaded.
# - verify: the full artifact set and SHA256SUMS, plus the Linux binary as shipped.
# - image: smoke-tested locally before it is pushed; prereleases do not move `latest`.
# - release: the GitHub release, last, from the verified artifacts. Prereleases are
#   marked as such and never become the "latest" release.
#
# Any failed job skips everything after it. A manual run (workflow_dispatch) is a rehearsal:
# every check runs against the chosen branch and tag, but nothing is pushed or released.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v0.1.2-rc.1 (must match the branch''s workspace version). Nothing is published.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  preflight:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/release/release.mjs plan --tag "$TAG" --image "ghcr.io/${{ github.repository }}"

  ci:
    name: Required checks
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  binaries:
    name: Build and check ${{ matrix.name }}
    needs: [preflight, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: vyrtel-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: vyrtel-linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: vyrtel-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: vyrtel-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The UI that passed lint, unit and E2E tests in the ci job.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        # Fails the build instead of embedding the "UI not built" placeholder.
        env:
          VYRTEL_REQUIRE_WEB_UI: '1'
        run: cargo build --release --locked -p server --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/vyrtel${ext}" "dist/${{ matrix.name }}${ext}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ./* > "../${{ matrix.name }}.sha256"; else shasum -a 256 ./* > "../${{ matrix.name }}.sha256"; fi
          mv "../${{ matrix.name }}.sha256" .
      - name: Check version output and embedded UI
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          node scripts/release/release.mjs verify-binary "dist/${{ matrix.name }}${ext}" --version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  verify:
    name: Verify release artifacts
    needs: [preflight, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vyrtel-*
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd artifacts
          cat ./*.sha256 | sed 's#\./##' > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
      - name: Check artifact set and checksums
        run: node scripts/release/release.mjs verify-artifacts artifacts
      - name: Check the Linux binary as shipped
        run: |
          chmod +x artifacts/vyrtel-linux-x86_64
          node scripts/release/release.mjs verify-binary artifacts/vyrtel-linux-x86_64 --version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*

  image:
    name: Container image
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vyrtel:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check version output and embedded UI
        run: |
          printed="$(docker run --rm vyrtel:release-candidate --version)"
          [ "$printed" = "vyrtel ${{ needs.preflight.outputs.version }}" ] || { echo "release gate: image --version printed '$printed'"; exit 1; }
          docker run -d --name vyrtel -p 8080:8080 vyrtel:release-candidate
          node scripts/release/release.mjs verify-server http://localhost:8080 --version "${{ needs.preflight.outputs.version }}"
          docker exec vyrtel /vyrtel healthcheck
      - name: Container logs
        if: always()
        run: docker logs vyrtel || true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        run: echo "${{ needs.preflight.outputs.image_tags }}"
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # From the preflight plan: prereleases get only their exact version tag.
          tags: ${{ needs.preflight.outputs.image_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs: [preflight, verify, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - name: Re-check checksums before publishing
        run: node scripts/release/release.mjs verify-artifacts artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
