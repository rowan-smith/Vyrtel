name: Release

# Publishes a release only after it has been validated (docs/releasing.md):
#
#   preflight ─┬─ functional (the full CI suite) ───────────────┐
#              └─ signoff (performance/reliability, compatibility) ┴─ binaries ─ verify ─ image-smoke ─ image ─ release
#
# Three gates decide whether a candidate ships; everything after them checks that what is
# published is exactly what they approved.
#
# - preflight: the tag must be v<semver> and match the workspace version, or nothing runs.
# - functional: every required CI check, run against the tagged commit.
# - signoff: from the release-evidence branch, fetched once:
#   - performance/reliability: every performance gate for the version has a reviewer PASS for
#     this exact commit, signed off before the tag was created. The sign-off itself happens
#     before tagging (scripts/release/release.mjs pretag); this job refuses to publish a tag
#     that bypassed it.
#   - compatibility: the version's COMPAT-GATE (every release, prereleases included) has a
#     reviewer PASS for this exact commit and the layout identity it writes, reviewed before the
#     tag and before any performance measurement of the same candidate (cleanup first).
# - binaries: built with the UI that CI tested; each one's --version and embedded UI are
#   checked on its own runner before it is uploaded.
# - verify: the full artifact set and SHA256SUMS, plus the Linux binary as shipped, and the
#   built artifacts match the hashes the performance and compatibility gates approved (or
#   documented equivalence).
# - image-smoke: on native amd64 and arm64 runners, each image is checked as an operator runs it:
#   non-root user and version label, readiness and the embedded UI, events surviving a recreated
#   container on a named volume, and the uid hint on an unwritable bind mount. Only then is it
#   pushed, by digest and untagged, and the pushed digest checked to have the tested layers.
# - image: tags exactly those two tested digests as the multi-platform release image (no
#   rebuild), then checks it in the registry; prereleases do not move `latest`.
# - release: the GitHub release, last, from the verified artifacts. Prereleases are
#   marked as such and never become the "latest" release.
#
# Any failed job skips everything after it. A manual run (workflow_dispatch) is a rehearsal:
# every check runs against the chosen branch and tag, but nothing is pushed or released.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v0.1.2-rc.1 (must match the branch''s workspace version). Nothing is published.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  preflight:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
      image_ref: ${{ steps.plan.outputs.image_ref }}
      image_repo: ${{ steps.plan.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: plan
        run: node scripts/release/release.mjs plan --tag "$TAG" --image "ghcr.io/${{ github.repository }}"

  functional:
    name: Functional gate (the full CI suite)
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  signoff:
    name: Performance/reliability and compatibility gates
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch approval records
        # A missing branch leaves evidence/ empty, which fails the checks below as missing evidence.
        run: |
          mkdir -p evidence
          if git fetch --depth=1 origin release-evidence; then git archive FETCH_HEAD | tar -x -C evidence; fi
      - name: Tag date
        id: tag
        run: |
          if [ "$PUBLISH" = "true" ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            # Empty for a lightweight tag, which the checks reject when gates are required.
            echo "date=$(git for-each-ref "refs/tags/$TAG" --format='%(taggerdate:iso-strict)')" >> "$GITHUB_OUTPUT"
          fi
      - name: Performance/reliability sign-off for this commit
        run: |
          args=()
          if [ "$PUBLISH" = "true" ]; then args=(--tag-date "${{ steps.tag.outputs.date }}"); fi
          node scripts/release/release.mjs check-performance --tag "$TAG" --sha "$GITHUB_SHA" --evidence evidence "${args[@]}"
      - name: Compatibility sign-off for this commit
        run: |
          args=()
          if [ "$PUBLISH" = "true" ]; then args=(--tag-date "${{ steps.tag.outputs.date }}"); fi
          node scripts/release/release.mjs check-compat --tag "$TAG" --sha "$GITHUB_SHA" --evidence evidence "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: signoff-evidence
          path: |
            evidence/performance
            evidence/compat
          if-no-files-found: ignore

  binaries:
    name: Build and check ${{ matrix.name }}
    needs: [preflight, functional, signoff]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: vyrtel-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: vyrtel-linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: vyrtel-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: vyrtel-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The UI that passed lint, unit and E2E tests in the functional gate.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        # Fails the build instead of embedding the "UI not built" placeholder.
        env:
          VYRTEL_REQUIRE_WEB_UI: '1'
        run: cargo build --release --locked -p server --target ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/vyrtel${ext}" "dist/${{ matrix.name }}${ext}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ./* > "../${{ matrix.name }}.sha256"; else shasum -a 256 ./* > "../${{ matrix.name }}.sha256"; fi
          mv "../${{ matrix.name }}.sha256" .
      - name: Check version output and embedded UI
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          node scripts/release/release.mjs verify-binary "dist/${{ matrix.name }}${ext}" --version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  verify:
    name: Verify release artifacts
    needs: [preflight, signoff, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: vyrtel-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: signoff-evidence
          path: evidence
        continue-on-error: true
      - name: Combined checksums
        run: |
          cd artifacts
          cat ./*.sha256 | sed 's#\./##' > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
      - name: Check artifact set and checksums
        run: node scripts/release/release.mjs verify-artifacts artifacts
      - name: Check the Linux binary as shipped
        run: |
          chmod +x artifacts/vyrtel-linux-x86_64
          node scripts/release/release.mjs verify-binary artifacts/vyrtel-linux-x86_64 --version "${{ needs.preflight.outputs.version }}"
      - name: Check artifacts match the approved candidate
        run: |
          mkdir -p evidence
          node scripts/release/release.mjs check-performance --tag "$TAG" --sha "$GITHUB_SHA" --evidence evidence --artifacts artifacts
          node scripts/release/release.mjs check-compat --tag "$TAG" --sha "$GITHUB_SHA" --evidence evidence --artifacts artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/*

  image-smoke:
    name: Container image (${{ matrix.platform }})
    needs: [preflight, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners: the image is run on the architecture it is built for, not emulated.
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.preflight.outputs.image_repo }}
          # The version label is the release version (from the Dockerfile build arg), not the tag.
          labels: org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: vyrtel:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VYRTEL_VERSION=${{ needs.preflight.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.runner }}
          cache-to: type=gha,scope=image-${{ matrix.runner }},mode=max
      # Non-root user and version label, --version, readiness and the embedded UI on a named
      # volume, events and settings surviving a recreated container, and the uid hint on an
      # unwritable bind mount (docs/releasing.md#container-image-checks). Records the tested
      # image's layers only if every check passes.
      - name: Smoke-test persistent deployment
        run: node scripts/release/release.mjs verify-image vyrtel:release-candidate --version "${{ needs.preflight.outputs.version }}" --platform "${{ matrix.platform }}" --bind-mount on --record tested
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Untagged: nothing can pull it by a release tag until `image` assembles both platforms.
      # Same builder, inputs and cache as the tested build; the next step proves the layers match.
      - name: Push the tested image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VYRTEL_VERSION=${{ needs.preflight.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.runner }}
          outputs: type=image,name=${{ needs.preflight.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
      - name: Check the pushed digest is the tested image
        if: env.PUBLISH == 'true'
        run: |
          node scripts/release/release.mjs verify-pushed-image "${{ needs.preflight.outputs.image_repo }}@${{ steps.push.outputs.digest }}" --version "${{ needs.preflight.outputs.version }}" --tested tested
          echo "${{ steps.push.outputs.digest }}" > "tested/$(echo '${{ matrix.platform }}' | tr / -).digest"
      - uses: actions/upload-artifact@v7
        with:
          name: image-tested-${{ strategy.job-index }}
          path: tested/

  image:
    name: Publish container image
    needs: [preflight, image-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: image-tested-*
          path: tested
          merge-multiple: true
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        run: |
          echo "${{ needs.preflight.outputs.image_tags }}"
          ls -l tested
      # Tags the smoke-tested per-platform images as one multi-platform image. Nothing is
      # rebuilt: the release tags point at exactly the digests image-smoke tested and pushed.
      - name: Publish the tested images under the release tags
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ needs.preflight.outputs.image_tags }}
          REPO: ${{ needs.preflight.outputs.image_repo }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          for f in tested/*.digest; do args+=("$REPO@$(cat "$f")"); done
          [ "$(ls tested/*.digest | wc -l)" -eq 2 ] || { echo "release gate: expected 2 tested digests"; exit 1; }
          docker buildx imagetools create "${args[@]}"
      # Every platform present, non-root, labelled, and with the tested image's layers.
      - name: Check the published image
        if: env.PUBLISH == 'true'
        run: node scripts/release/release.mjs verify-pushed-image "${{ needs.preflight.outputs.image_ref }}" --version "${{ needs.preflight.outputs.version }}" --tested tested

  release:
    name: Publish GitHub release
    needs: [preflight, verify, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts
      - name: Re-check checksums before publishing
        run: node scripts/release/release.mjs verify-artifacts artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
