# Development convenience only. Production needs nothing but `docker run`
# (see README). This builds the image locally and keeps data in ./observer-data.
services:
  observer:
    build: .
    image: observer:dev
    ports:
      - "8080:8080"
    volumes:
      - ./observer-data:/data
    environment:
      OBSERVER_LOG_LEVEL: info
      # OBSERVER_AUTH_ENABLED: "true"
      # OBSERVER_AUTH_ADMIN_PASSWORD: change-me
    restart: unless-stopped
