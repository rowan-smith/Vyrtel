# Development convenience only. Production needs nothing but `docker run`
# (see README). This builds the image locally and keeps data in ./vyrtel-data.
services:
  vyrtel:
    build: .
    image: vyrtel:dev
    ports:
      - "8080:8080"
    volumes:
      - ./vyrtel-data:/data
    environment:
      VYRTEL_LOG_LEVEL: info
      # The UI always needs a login; without this a password is generated and printed once.
      # VYRTEL_AUTH_ADMIN_PASSWORD: change-me
      # Require API keys for ingestion (open by default).
      # VYRTEL_AUTH_INGEST_API_KEY: "true"
    restart: unless-stopped
    # Longer than server.shutdown_timeout (8s), so in-flight requests drain
    # before Docker force-kills the container.
    stop_grace_period: 15s
