[package]
name = "server"
description = "Vyrtel: a small, self-hosted observability server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "vyrtel"

[[bin]]
name = "vyrtel"
path = "src/main.rs"

[features]
# Test-only: lets the integration tests inject storage write failures
# (see crates/storage/src/fault.rs). Never enable in release builds.
fault-injection = ["storage/fault-injection"]

[dependencies]
telemetry.workspace = true
storage.workspace = true
query.workspace = true
ingest.workspace = true
metadata.workspace = true

anyhow.workspace = true
argon2.workspace = true
async-compression.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
mime_guess.workspace = true
rand.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Embeds the app icon and version info into vyrtel.exe (Windows hosts only; see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
crc32fast.workspace = true
flate2.workspace = true
prost.workspace = true
# Edits metadata databases directly in data-directory tests.
rusqlite.workspace = true
tempfile.workspace = true
tower.workspace = true
# Rewrites segment summaries in upgrade tests.
zstd.workspace = true
ingest.workspace = true
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
telemetry.workspace = true
tokio.workspace = true

[[test]]
name = "integration"
path = "../../tests/integration/main.rs"

# Installs a counting global allocator, so it runs as its own process.
[[test]]
name = "overload"
path = "../../tests/overload/main.rs"
