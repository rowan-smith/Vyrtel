[package]
name = "storage"
description = "WAL, immutable segments, indexes, retention and recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
telemetry.workspace = true
crc32fast.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
zstd.workspace = true

[features]
# Test-only fault injection: `VYRTEL_CRASH_AT=<point>` aborts the process at
# a named point (see src/crash.rs). Never enable in release builds.
crash-points = []

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
telemetry = { workspace = true, features = ["testing"] }

[[bench]]
name = "storage"
harness = false

# Kills real processes at injected crash points; needs `--features crash-points`
# (CI runs `cargo test --workspace --all-features`).
[[test]]
name = "crash"
required-features = ["crash-points"]
