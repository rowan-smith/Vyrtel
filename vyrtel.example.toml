# Example Vyrtel configuration. Copy to vyrtel.toml (picked up
# automatically from the working directory) or pass --config <file>.
# Every key is optional; see docs/configuration.md.

[server]
bind = "0.0.0.0:8080"
# After SIGTERM/Ctrl+C, how long accepted work may take to drain before
# Vyrtel reports what is unfinished and exits with status 1. Keep it below
# your orchestrator's grace period (Docker: 10s by default).
shutdown_timeout = "8s"

[storage]
path = "./data"
max_memory = "512MB"
segment_target_size = "64MB"
segment_max_age = "5m"
durability = "normal"        # or "strict": fsync before acknowledging

[retention]
logs = "30d"
traces = "14d"
metrics = "30d"

[ingest]
max_request_size = "1MB"     # per request, after gzip decoding; larger bodies get 413
queue_capacity = 10000
# Requests in progress at once. 0 derives it from max_memory: each admitted
# request is budgeted at 20x max_request_size (3 at these settings). Startup
# fails if not even one fits; an explicit value is honoured, with a warning
# if it is estimated to exceed the ingest budget. See docs/configuration.md.
max_concurrent = 0

[query]
timeout = "30s"              # execution time per request; 504 query_timeout beyond
max_concurrent = 4           # requests executing at once
queue_timeout = "10s"        # wait for a free slot, then 503; "0s" rejects at once
max_scan_bytes = "4GB"       # compressed bytes one request may read; 422 beyond
max_trace_spans = 50000      # spans one trace may return; 422 beyond
max_metric_names = 10000     # names GET /api/v1/metrics returns; "truncated": true beyond

[auth]
enabled = false
# admin_username = "admin"
# admin_password = "change-me"

[log]
level = "info"
format = "text"              # or "json"
