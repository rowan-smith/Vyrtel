# Example Vyrtel configuration. Copy to vyrtel.toml (picked up
# automatically from the working directory) or pass --config <file>.
# Every key is optional; see docs/configuration.md.

[server]
bind = "0.0.0.0:8080"

[storage]
path = "./data"
max_memory = "512MB"
segment_target_size = "64MB"
segment_max_age = "5m"
durability = "normal"        # or "strict": fsync before acknowledging

[retention]
logs = "30d"
traces = "14d"
metrics = "30d"

[ingest]
max_request_size = "1MB"     # per request, after gzip decoding; larger bodies get 413
queue_capacity = 10000
# Requests in progress at once. 0 derives it from max_memory: each admitted
# request is budgeted at 20x max_request_size (3 at these settings). Startup
# fails if not even one fits; an explicit value is honoured, with a warning
# if it is estimated to exceed the ingest budget. See docs/configuration.md.
max_concurrent = 0

[query]
timeout = "30s"
max_concurrent = 4

[auth]
enabled = false
# admin_username = "admin"
# admin_password = "change-me"

[log]
level = "info"
format = "text"              # or "json"
