[workspace]
resolver = "2"
members = [
    "crates/telemetry",
    "crates/storage",
    "crates/query",
    "crates/ingest",
    "crates/metadata",
    "crates/server",
    "tools/loadgen",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/rowan-smith/Vyrtel"

[workspace.dependencies]
# Internal crates
telemetry = { path = "crates/telemetry" }
storage = { path = "crates/storage" }
query = { path = "crates/query" }
ingest = { path = "crates/ingest" }
metadata = { path = "crates/metadata" }

# External
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
mime_guess = { version = "2", default-features = false }
prost = { version = "0.13", default-features = false, features = ["std", "derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["decompression-gzip", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", default-features = false }

# Dev
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Benchmarks and tests want reasonable speed for storage-heavy code.
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
